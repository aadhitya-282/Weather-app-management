<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg,#74ebd5,#9face6);
        }
        .container {
            width: 420px;
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        .search-box input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }
        .search-box input:focus {
            border-color: #6c63ff;
        }
        .search-box button {
            padding: 12px 18px;
            border: none;
            border-radius: 10px;
            background: #6c63ff;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }
        .search-box button:hover {
            background: #574fd6;
        }
        .weather-card {
           margin-top: 20px;
           padding: 25px;
           border-radius: 15px;
           background: linear-gradient(135deg, #667eea, #764ba2);
           color: white;
        }
        .weather-card h2 {
            margin-bottom: 20px;
        }
        .temperature {
            font-size: 50px;
            font-weight: bold;
            margin: 15px 0;
        }
        .weather-info {
            margin-top: 15px;
        }
        .weather-info p {
            margin: 10px 0;
            font-size: 17px;
        }
        .error {
            color: #d9534f;
            margin-top: 15px;
        }
        .footer {
            margin-top: 20px;
            color: #999;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌤️ Weather App</h1>
        <p class="subtitle">Check the current weather of any city</p>
        <form method="POST" class="search-box">
            <input type="text" name="city" placeholder="Enter city name" required>
            <button type="submit",font-weight=bold>Search</button>
        </form>
        {% if weather %}
        <div class="weather-card">
            <h2>{{ weather.city }}</h2>
            <div class="temperature">{{ weather.temperature }} °C</div>
            <div class="weather-info">
                <p>🌡️ Feels Like: {{ weather.feels_like }} °C</p>
                <p>💧 Humidity: {{ weather.humidity }} %</p>
                <p>☁️ Weather Code: {{ weather.weather_code }}</p>
            </div>
        </div>
        {% endif %}
        <div class="footer">Powered by Open-Meteo</div>
    </div>
</body>
</html>
